<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaPredict - Water Quality Index Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="hero-background"></div>
    
    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fas fa-water"></i>
                </div>
                <div class="logo-text">
                    <h1>AquaPredict</h1>
                    <p class="tagline">Advanced Water Quality Analysis System</p>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="content-wrapper">
            <!-- Input Form Section -->
            <section class="form-section">
                <div class="section-title">
                    <i class="fas fa-flask"></i>
                    <h2>Water Parameters</h2>
                </div>
                
                <form id="wqi-form" class="parameter-form">
                    <div class="parameters-grid">
                        <!-- Temperature -->
                        <div class="param-card">
                            <div class="param-icon" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                                <i class="fas fa-thermometer-half"></i>
                            </div>
                            <label class="param-label">Temperature (°C)</label>
                            <div class="input-row">
                                <input type="number" step="0.1" name="Min_Temperature" placeholder="Min" required>
                                <span class="separator">-</span>
                                <input type="number" step="0.1" name="Max_Temperature" placeholder="Max" required>
                            </div>
                        </div>

                        <!-- Dissolved Oxygen -->
                        <div class="param-card">
                            <div class="param-icon" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                                <i class="fas fa-wind"></i>
                            </div>
                            <label class="param-label">Dissolved Oxygen (mg/L)</label>
                            <div class="input-row">
                                <input type="number" step="0.1" name="Min_Dissolved_Oxygen" placeholder="Min" required>
                                <span class="separator">-</span>
                                <input type="number" step="0.1" name="Max_Dissolved_Oxygen" placeholder="Max" required>
                            </div>
                        </div>

                        <!-- pH -->
                        <div class="param-card">
                            <div class="param-icon" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
                                <i class="fas fa-vial"></i>
                            </div>
                            <label class="param-label">pH Level</label>
                            <div class="input-row">
                                <input type="number" step="0.1" name="Min_pH" placeholder="Min" required>
                                <span class="separator">-</span>
                                <input type="number" step="0.1" name="Max_pH" placeholder="Max" required>
                            </div>
                        </div>

                        <!-- Conductivity -->
                        <div class="param-card">
                            <div class="param-icon" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">
                                <i class="fas fa-bolt"></i>
                            </div>
                            <label class="param-label">Conductivity (µS/cm)</label>
                            <div class="input-row">
                                <input type="number" step="0.1" name="Min_Conductivity" placeholder="Min" required>
                                <span class="separator">-</span>
                                <input type="number" step="0.1" name="Max_Conductivity" placeholder="Max" required>
                            </div>
                        </div>

                        <!-- BOD -->
                        <div class="param-card">
                            <div class="param-icon" style="background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);">
                                <i class="fas fa-microscope"></i>
                            </div>
                            <label class="param-label">BOD (mg/L)</label>
                            <div class="input-row">
                                <input type="number" step="0.1" name="Min_BOD" placeholder="Min" required>
                                <span class="separator">-</span>
                                <input type="number" step="0.1" name="Max_BOD" placeholder="Max" required>
                            </div>
                        </div>

                        <!-- Nitrate -->
                        <div class="param-card">
                            <div class="param-icon" style="background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);">
                                <i class="fas fa-seedling"></i>
                            </div>
                            <label class="param-label">Nitrate (mg/L)</label>
                            <div class="input-row">
                                <input type="number" step="0.1" name="Min_Nitrate" placeholder="Min" required>
                                <span class="separator">-</span>
                                <input type="number" step="0.1" name="Max_Nitrate" placeholder="Max" required>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">
                        <i class="fas fa-chart-line"></i>
                        <span>Analyze Water Quality</span>
                        <div class="btn-glow"></div>
                    </button>
                </form>
            </section>

            <!-- Results Section -->
            <section id="result" class="results-section" style="display: none;">
                <!-- WQI Score Display -->
                <div class="wqi-display-card">
                    <div class="wqi-badge">
                        <div class="badge-circle">
                            <div class="wqi-score" id="wqi-score">0</div>
                            <div class="wqi-label">WQI</div>
                        </div>
                        <div class="quality-rings">
                            <div class="ring ring-1"></div>
                            <div class="ring ring-2"></div>
                            <div class="ring ring-3"></div>
                        </div>
                    </div>
                    
                    <div class="wqi-info">
                        <h3 id="wqi-category" class="wqi-category">Excellent</h3>
                        <p id="wqi-description" class="wqi-desc">Water quality is exceptional</p>
                        
                        <div class="metrics-grid">
                            <div class="metric-item">
                                <i class="fas fa-shield-alt"></i>
                                <div>
                                    <span class="metric-label">Safety</span>
                                    <span id="safety-level" class="metric-value">High</span>
                                </div>
                            </div>
                            <div class="metric-item">
                                <i class="fas fa-leaf"></i>
                                <div>
                                    <span class="metric-label">Ecosystem</span>
                                    <span id="ecosystem-impact" class="metric-value">Minimal</span>
                                </div>
                            </div>
                            <div class="metric-item">
                                <i class="fas fa-heartbeat"></i>
                                <div>
                                    <span class="metric-label">Health Risk</span>
                                    <span id="health-risk" class="metric-value">None</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Charts Section -->
                <div class="charts-container">
                    <div class="chart-tabs">
                        <button class="tab-btn active" data-chart="bar">
                            <i class="fas fa-chart-bar"></i>
                            <span>Bar Chart</span>
                        </button>
                        <button class="tab-btn" data-chart="radar">
                            <i class="fas fa-chart-area"></i>
                            <span>Radar Chart</span>
                        </button>
                    </div>
                    
                    <div class="chart-wrapper">
                        <canvas id="waterQualityChart"></canvas>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
